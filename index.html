<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I-RULE01 Developer Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left index + reading column; index collapses to a top drawer at phone width. */
:root{
  --bg:#14100d; --panel:#1c1713; --panel2:#241d17; --line:#3a2f25;
  --fg:#ece3d6; --muted:#a39785; --amber:#f0a73c; --bronze:#b8864a; --ember:#e2663a;
  --font-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --code:#0e0b09; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f1e9; --panel:#ece4d6; --panel2:#e3d8c6; --line:#cfc1a8; --fg:#241c14; --muted:#6d5f4d;
  --amber:#a8620a; --bronze:#7a5320; --ember:#b8431c; --code:#fbf8f2; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f6f1e9; --panel:#ece4d6; --panel2:#e3d8c6; --line:#cfc1a8; --fg:#241c14; --muted:#6d5f4d;
  --amber:#a8620a; --bronze:#7a5320; --ember:#b8431c; --code:#fbf8f2; color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--font-b)}
a{color:var(--amber);text-underline-offset:3px}
a:hover{color:var(--ember)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:100%}
nav#idx{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 14px 28px max(16px,env(safe-area-inset-left,0px))}
.brand{font:700 26px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;color:var(--fg)}
.brand b{color:var(--amber);font-weight:700}
.tag{font-size:12px;color:var(--muted);margin:0 0 18px;letter-spacing:.02em}
.grp{font:600 12px/1 var(--font-d);letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);margin:20px 0 6px;font-size:13px}
nav#idx a{display:block;color:var(--fg);text-decoration:none;padding:5px 9px;border-radius:5px;font-size:13.5px;line-height:1.35}
nav#idx a:hover{background:var(--panel2)}
nav#idx a[aria-current="page"]{background:var(--panel2);color:var(--amber);box-shadow:inset 2px 0 0 var(--amber)}
main#view{overflow-y:auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 80px 40px;min-width:0}
.bar{display:none}
article{max-width:880px;margin:0 auto;min-width:0}
article h1{font:700 clamp(34px,5vw,54px)/1.02 var(--font-d);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 18px;text-wrap:balance}
article h2{font:700 30px/1.1 var(--font-d);letter-spacing:.03em;text-transform:uppercase;margin:42px 0 12px;padding-top:6px;border-top:1px solid var(--line);color:var(--amber);text-wrap:balance}
article h3{font:600 21px/1.2 var(--font-d);letter-spacing:.04em;text-transform:uppercase;margin:28px 0 8px}
article h4{font-size:15px;margin:20px 0 4px}
article p,article li{max-width:72ch}
article img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin:16px 0 6px;background:var(--panel)}
article [align=center]{text-align:center}
article [align=center] img{margin-inline:auto}
article blockquote{margin:18px 0;padding:6px 18px;border-left:3px solid var(--amber);background:var(--panel);color:var(--fg)}
article blockquote p{margin:8px 0}
article code{font:13px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:3px;border:1px solid var(--line)}
article pre{background:var(--code);border:1px solid var(--line);padding:14px;border-radius:4px;overflow-x:auto}
article pre code{border:0;padding:0;background:none}
article hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:4px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
.tw th{background:var(--panel2);text-align:left;font:600 12px/1.3 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--bronze);font-size:13px}
.tw th,.tw td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tw td{min-width:90px}
.tw tr:last-child td{border-bottom:0}
.loading{color:var(--muted)}
.pdf{display:inline-block;margin:2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:4px;text-decoration:none}

.tk-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.tk-sum div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tk-sum b{display:block;font:700 28px/1 var(--font-d);color:var(--amber);font-variant-numeric:tabular-nums}
.tk-sum span{font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}
.tk-f{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.tk-f select,.tk-f input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:7px 10px;font:14px var(--font-b)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font:700 19px/1.15 var(--font-d);letter-spacing:.03em;text-transform:uppercase}
.card .id{font:600 12px var(--font-b);color:var(--bronze);letter-spacing:.06em}
.card .meta{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font:600 11px/1 var(--font-b);padding:4px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line)}
.pill.missing{color:var(--ember);border-color:var(--ember)}
.pill.sheet{color:var(--bronze);border-color:var(--bronze)}
.pill.prog{color:var(--amber);border-color:var(--amber);height:auto;background:none;overflow:visible;margin:0}
.pill.done{background:var(--amber);color:#1a1209;border-color:var(--amber)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{aspect-ratio:16/10;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);background:var(--bg);overflow:hidden;padding:4px}
.slot img{width:100%;height:100%;object-fit:cover;margin:0;border:0;border-radius:0}
.slot.ok{border-style:solid}
.views{display:flex;flex-wrap:wrap;gap:4px}
.views span{font-size:11px;padding:2px 6px;border:1px dashed var(--line);border-radius:3px;color:var(--muted)}
.views span.ok{border-style:solid;border-color:var(--amber);color:var(--amber)}
.path{font:12px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:7px 12px;font:600 13px var(--font-b);cursor:pointer}

article.wide{max-width:1080px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.acts.sm{margin:6px 0;gap:6px}
a.btn{display:inline-block;text-decoration:none}
.btn.pri{background:var(--amber);color:#1a1209;border-color:var(--amber)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:hover{border-color:var(--amber)}
.grp2{font:700 22px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--bronze);margin:26px 0 6px}
ol.nl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nr{max-width:none!important}
.no{font:700 30px/1 var(--font-d);color:var(--amber);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.nr{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.ni{display:grid;grid-template-columns:36px 128px minmax(0,1fr);gap:12px;align-items:center}
.nt{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:4px;background:var(--bg);overflow:hidden;display:block}
.nt.ok{border-style:solid;background:#cfcfcf}
.nt .ia,.vt .ia,.sheetbox .ia{display:block;width:100%;height:100%}
.nt img{width:100%;height:100%;object-fit:contain;margin:0;border:0;border-radius:0;display:block}
.nn{font:700 20px/1.15 var(--font-d);letter-spacing:.03em;text-transform:uppercase}
.nact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
section.asset{margin:34px 0 0;padding:18px 0 4px;border-top:2px solid var(--line)}
.ah{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h3.an{font:700 34px/1.05 var(--font-d);letter-spacing:.03em;text-transform:uppercase;margin:2px 0 0;color:var(--amber)}
.desc{color:var(--muted);font-size:14px;margin:8px 0}
.dress{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.dress ul{margin:4px 0 0;padding-left:18px}
.note{font-size:13px;color:var(--amber);margin:4px 0 8px}
.sheetbox{border:1px dashed var(--line);border-radius:6px;background:var(--bg);overflow:hidden;min-height:140px;display:flex;align-items:center;justify-content:center}
.sheetbox.ok{border-style:solid;background:#cfcfcf}
.sheetbox img{width:100%;height:auto;margin:0;border:0;border-radius:0;display:block}
.sheetbox .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}
section.asset h4{margin:18px 0 6px;font:600 16px var(--font-b)}
.meta{font-size:12px;color:var(--muted);font-weight:400}
pre.pt{white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;margin:6px 0;max-height:none}
.tipbox{background:var(--panel);border:1px solid var(--amber);border-radius:6px;padding:10px 14px;margin:0 0 12px;font-size:14px}
details.opt{margin:18px 0 0;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
details.opt>summary{cursor:pointer}
.dgrid .vt{aspect-ratio:1/1}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.vt{aspect-ratio:4/5;border:1px dashed var(--line);border-radius:4px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-size:11px;color:var(--muted)}
.vt.ok{border-style:solid;background:#cfcfcf}
.vt img{width:100%;height:100%;object-fit:contain;margin:0;border:0;border-radius:0;display:block}
.vl{font:700 15px var(--font-d);letter-spacing:.05em;text-transform:uppercase;margin:6px 0 0}
.vc details{margin-top:4px}
.vc summary{cursor:pointer}
@media (max-width:520px){.ni{grid-template-columns:28px 92px minmax(0,1fr);gap:8px}h3.an{font-size:28px}}
@media (max-width:820px){
  .app{display:block;height:auto}
  nav#idx{display:none;position:fixed;inset:0;z-index:20;padding-top:calc(60px + env(safe-area-inset-top,0px));border:0}
  body.open nav#idx{display:block}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .bar .brand{font-size:22px;margin:0}
  main#view{overflow:visible;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  article h2{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){article{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var NAV=[
 ['Start',[['README.md','Overview'],['docs/00-start-here.md','Start here (reading paths)'],['docs/how-it-plays.md','How it plays']]],
 ['Game design',[['docs/01-vision-and-pillars.md','01 Vision and pillars'],['docs/02-story-and-lore.md','02 Story and lore'],['docs/03-world-and-level-design.md','03 World and level design'],['docs/04-characters-and-companions.md','04 Characters and companions'],['docs/05-enemies.md','05 Enemies'],['docs/06-core-systems.md','06 Core systems'],['docs/08-the-throne.md','08 The Throne']]],

];
var PDFS=[['design/GDD_Legend_and_Game_Design.pdf','Game design document'],['design/Story_Meaning_Goal.pdf','Story, meaning, goal'],['design/Pitch_Deck_Master_Brief.pdf','Pitch deck brief'],['design/Elias_Character_Reference.pdf','Elias reference'],['design/Island_Map.pdf','Island map'],['design/Throne_Wow_Direction.pdf','Throne direction'],['art-pipeline/3D_Reference_Prompt_Pack.pdf','3D prompt pack']];
function slug(p){return p.replace(/\.md$/,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}
var MAP={};
var idx=document.getElementById('idx');
var h='<p class="brand">I-<b>RULE</b>01</p><p class="tag">Developer hub · The Creative Fire</p>';
NAV.forEach(function(g){h+='<div class="grp">'+g[0]+'</div>';g[1].forEach(function(i){MAP[slug(i[0])]=i[0];h+='<a href="#'+slug(i[0])+'" data-p="'+i[0]+'">'+i[1]+'</a>'})});
h+='<div class="grp">PDFs</div>';PDFS.forEach(function(i){h+='<a href="'+i[0]+'" target="_blank" rel="noopener">'+i[1]+'</a>'});
idx.innerHTML=h;
function norm(base,rel){var d=base.split('/');d.pop();rel.split('/').forEach(function(s){if(s==='..')d.pop();else if(s&&s!=='.')d.push(s)});return d.join('/')}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function pimg(u){return new Promise(function(r){var i=new Image();i.onload=function(){r(true)};i.onerror=function(){r(false)};i.src=u})}
function head(u){return fetch(u,{method:'HEAD',cache:'no-cache'}).then(function(r){return r.ok}).catch(function(){return pimg(u)})}
var LIB={A:[],P:{}};
function copyText(t,b){
  var done=function(){var o=b.getAttribute('data-l')||b.textContent;b.setAttribute('data-l',o);b.textContent='Copied';setTimeout(function(){b.textContent=o},1500)};
  var fb=function(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
}
function imgTag(base,k,alt,big){
  return '<a href="'+base+k+'.jpg" target="_blank" rel="noopener" class="ia"><img loading="lazy" src="'+base+'thumbs/'+k+'.jpg" onerror="this.onerror=null;this.src=\''+base+k+'.jpg\'" alt="'+esc(alt)+'"></a>';
}
function vcardf(x,p){return function(v){return '<div class="vc" data-k="'+v.k+'"><div class="vt" data-vt><span class="path">Missing<br>'+v.k+'.jpg</span></div><div class="vl">'+esc(v.label)+'</div><div class="acts sm"><span data-dl></span><button class="btn sm" data-pid="'+x.id+'" data-pk="'+v.k+'">Copy prompt</button><a class="btn sm" href="prompts/assets/'+x.id+'/'+v.k+'.txt" download="'+x.id+'_'+v.k+'_prompt.txt">Prompt .txt</a></div><details><summary class="meta">Show prompt</summary><pre class="pt">'+esc((p.views||{})[v.k]||'')+'</pre></details></div>'}}
function isdet(v){return v.k.indexOf('detail')===0}
function renderLibrary(mode){
  Promise.all([fetch('data/assets.json').then(function(r){return r.json()}),fetch('data/prompts.json').then(function(r){return r.json()})]).then(function(R){
    var A=R[0],P=R[1];LIB.P=P;
    var isl=mode==='islands';
    var L=isl?A.filter(function(x){return x.cat==='Islands'}):A;LIB.A=L;
    var cats=['Islands','Structures','Sky','Throne','Creatures'];
    var totalDet=L.reduce(function(a,x){return a+x.views.filter(isdet).length},0);var totalOpt=L.reduce(function(a,x){return a+x.views.filter(function(v){return !isdet(v)}).length},0);
    var allTxt=isl?'prompts/islands-core-prompts.txt':'prompts/all-asset-core-prompts.txt';
    var h='<div id="lib-top"></div><h1>'+(isl?'Islands':'Asset library')+'</h1>';
    h+='<p>'+(isl?'The '+L.length+' floating islands of the world. <b>Part 1</b> is the numbered list. <b>Part 2</b> has every island with its images (each with a Download button) and the exact prompt that made it (each with a Copy button).':'Every object in the game, with its images, downloads and prompts. <b>Part 1</b> is the numbered list. <b>Part 2</b> has every asset in full.')+' To add or replace an image, put it in <code>art/assets/&lt;ID&gt;/</code> with the file name shown and this page updates itself.</p>';
    h+='<div class="tk-sum"><div><b id="n-total">'+L.length+'</b><span>'+(isl?'islands':'assets')+'</span></div><div><b id="n-sheet">0</b><span>turnaround sheets in</span></div><div><b id="n-views">0</b><span>detail close-ups in (of '+totalDet+')</span></div><div><b id="n-comp">0</b><span>complete (sheet + details)</span></div><div><b id="n-opt">0</b><span>optional 3D single angles (of '+totalOpt+')</span></div></div>';
    h+='<div class="prog" aria-hidden="true"><i id="bar"></i></div><p id="barlbl" style="font-size:12px;color:var(--muted);margin:2px 0 14px"></p>';
    h+='<div class="tipbox"><b>How to generate:</b> every prompt below is <b>one image</b>. Paste <b>one prompt per message</b>. Start with the sheet (all sides in one image), then make the detail close-ups yourself, one at a time. The single angles are optional extras for 3D tools.</div><div class="acts"><a class="btn" href="art-pipeline/3D_Reference_Prompt_Pack.pdf" target="_blank" rel="noopener">Open the PDF prompt pack</a></div>';
    h+='<div class="tk-f">'+(isl?'':'<label for="fc">Group</label><select id="fc"><option value="">All</option>'+cats.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select>')+'<label for="fs">Status</label><select id="fs"><option value="">All</option><option value="missing">Missing</option><option value="sheet">Needs details</option><option value="prog">In progress</option><option value="done">Complete</option></select><label for="fq">Find</label><input id="fq" type="search" placeholder="ID or name"></div>';
    // PART 1
    h+='<h2>Part 1 · The list</h2><ol class="nl" id="nl">';
    var n=0,lastc='';
    L.forEach(function(x){n++;
      if(!isl&&x.cat!==lastc){lastc=x.cat;h+='</ol><div class="grp2" data-cat="'+x.cat+'">'+x.cat+'</div><ol class="nl">'}
      h+='<li class="nr" data-id="'+x.id+'" data-cat="'+x.cat+'" data-q="'+esc((x.id+' '+x.name).toLowerCase())+'"><div class="ni"><div class="no">'+n+'</div><div class="nt" data-t></div><div class="nb"><div class="id">'+x.id+' · '+x.size+'</div><div class="nn"><b>'+esc(x.name)+'</b></div><div class="meta">'+esc(x.short||'')+'</div><div class="nact"><span class="pill missing" data-st>Missing</span> <button class="btn sm" data-go="sec-'+x.id+'">See images &amp; prompts</button></div></div></div></li>';
    });
    h+='</ol>';
    // PART 2
    h+='<h2>Part 2 · Images and prompts</h2>';
    L.forEach(function(x){
      var base='art/assets/'+x.id+'/',p=P[x.id]||{sheet:'',views:{}};
      h+='<section class="asset" id="sec-'+x.id+'" data-id="'+x.id+'" data-cat="'+x.cat+'" data-q="'+esc((x.id+' '+x.name).toLowerCase())+'">'
       +'<div class="ah"><div><div class="id">'+x.id+' · '+x.cat+' · '+esc(x.size)+'</div><h3 class="an">'+esc(x.name)+'</h3></div><span class="pill missing" data-st>Missing</span></div>'
       +'<p class="desc">'+esc(cap(x.desc))+'.</p>'
       +(x.note?'<p class="note">Note: '+esc(x.note)+'</p>':'')
       +(x.dress&&x.dress.length?'<div class="dress"><b>Put on this island</b> <span class="meta">(separate structures; suggested)</span><ul>'+x.dress.map(function(d){return '<li><span class="id">'+d.id+'</span> '+esc(d.name)+' <span class="meta">· '+esc(d.where)+'</span></li>'}).join('')+'</ul></div>':'')
       +'<div class="sheetbox" data-sheet><div class="empty">Turnaround sheet not added yet.<br><span class="path">'+base+'sheet.jpg</span></div></div>'
       +'<div class="acts"><span data-dl-sheet></span><a class="btn" href="prompts/assets/'+x.id+'/sheet.txt" download="'+x.id+'_sheet_prompt.txt">Download sheet prompt (.txt)</a><button class="btn" data-pid="'+x.id+'" data-pk="sheet">Copy sheet prompt</button></div>'
       +'<h4>Sheet prompt <span class="meta">(one image, all angles)</span></h4><pre class="pt">'+esc(p.sheet)+'</pre>'
       +(x.views.some(isdet)?'<h4>Detail close-ups <span class="meta">(attach the approved sheet as a reference)</span></h4><div class="vgrid dgrid">'+x.views.filter(isdet).map(vcardf(x,p)).join('')+'</div>':'')
       +'<details class="opt"><summary><b>Optional: single angles for 3D tools</b> <span class="meta">('+x.views.filter(function(v){return !isdet(v)}).length+' images, make them later, one at a time)</span></summary><div class="vgrid">'+x.views.filter(function(v){return !isdet(v)}).map(vcardf(x,p)).join('')+'</div></details>'
       +'<p class="meta"><button class="btn sm" data-go="lib-top">Back to the list</button> <span class="path">'+base+'</span></p></section>';
    });
    doc.className='wide';doc.innerHTML=h;
    var state={},ns=0,nv=0,no=0,nc=0;
    L.forEach(function(x){state[x.id]={sheet:false,n:0,o:0,total:x.views.filter(isdet).length}});
    function stat(st){return !st.sheet?((st.n||st.o)?'prog':'missing'):st.n<st.total?(st.n===0?'sheet':'prog'):'done'}
    function upd(){nc=0;L.forEach(function(x){if(stat(state[x.id])==='done')nc++});document.getElementById('n-sheet').textContent=ns;document.getElementById('n-views').textContent=nv;document.getElementById('n-opt').textContent=no;document.getElementById('n-comp').textContent=nc;
      var pct=Math.round((ns+nv)/(L.length+totalDet)*1000)/10;document.getElementById('bar').style.width=pct+'%';document.getElementById('barlbl').textContent=pct+'% of the core images (sheets + detail close-ups)'}
    function setpill(id){var st=state[id],k=stat(st),t={missing:'Missing',sheet:'Needs details',prog:'In progress',done:'Complete'}[k]+(k==='prog'?' ('+(st.n+(st.sheet?1:0))+'/'+(st.total+1)+')':'');
      [].forEach.call(doc.querySelectorAll('[data-id="'+id+'"]'),function(el){el.setAttribute('data-s',k);var p=el.querySelector('[data-st]');p.className='pill '+k;p.textContent=t});filter()}
    function filter(){var fc=document.getElementById('fc'),c=fc?fc.value:'',s=document.getElementById('fs').value,q=document.getElementById('fq').value.toLowerCase();
      [].forEach.call(doc.querySelectorAll('[data-id]'),function(el){el.hidden=!((!c||el.getAttribute('data-cat')===c)&&(!s||el.getAttribute('data-s')===s)&&(!q||el.getAttribute('data-q').indexOf(q)>-1))});
      [].forEach.call(doc.querySelectorAll('.grp2'),function(g){g.hidden=!!c&&g.getAttribute('data-cat')!==c})}
    ['fc','fs'].forEach(function(i){var e=document.getElementById(i);e&&e.addEventListener('change',filter)});document.getElementById('fq').addEventListener('input',filter);
    L.forEach(function(x){
      var base='art/assets/'+x.id+'/',sec=document.getElementById('sec-'+x.id),row=doc.querySelector('li[data-id="'+x.id+'"]');
      sec.setAttribute('data-s','missing');row.setAttribute('data-s','missing');
      head(base+'sheet.jpg').then(function(ok){if(!ok)return;state[x.id].sheet=true;ns++;
        sec.querySelector('[data-sheet]').innerHTML=imgTag(base,'sheet','Turnaround sheet for '+x.name);sec.querySelector('[data-sheet]').className='sheetbox ok';
        sec.querySelector('[data-dl-sheet]').innerHTML='<a class="btn pri" href="'+base+'sheet.jpg" download="'+x.id+'_sheet.jpg">Download sheet image</a>';
        row.querySelector('[data-t]').innerHTML=imgTag(base,'sheet','');row.querySelector('[data-t]').className='nt ok';
        setpill(x.id);upd()});
      x.views.forEach(function(v){head(base+v.k+'.jpg').then(function(ok){if(!ok)return;var st=state[x.id];if(isdet(v)){st.n++;nv++}else{st.o++;no++}
        var c=sec.querySelector('[data-k="'+v.k+'"]');c.querySelector('[data-vt]').innerHTML=imgTag(base,v.k,x.name+' '+v.label);c.querySelector('[data-vt]').className='vt ok';
        c.querySelector('[data-dl]').innerHTML='<a class="btn pri sm" href="'+base+v.k+'.jpg" download="'+x.id+'_'+v.k+'.jpg">Download</a>';
        setpill(x.id);upd()})});
    });
    upd();view.scrollTop=0;window.scrollTo(0,0);
  }).catch(function(e){console.error(e);doc.innerHTML='<h1>Library</h1><p>The asset list could not be loaded.</p>'});
}

var doc=document.getElementById('doc'),view=document.getElementById('view');
var pending=null;
function route(){
  var s=(location.hash||'').slice(1)||'readme';
  var path=MAP[s]||'README.md';
  document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');
  [].forEach.call(idx.querySelectorAll('a[data-p]'),function(a){a.getAttribute('data-p')===path?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  doc.innerHTML='<p class="loading">Loading…</p>';
  doc.className='';
  if(path==='tracker'){renderLibrary('all');return}
  if(path==='islands'){renderLibrary('islands');return}
  fetch(path).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    doc.innerHTML=marked.parse(t,{mangle:false});
    [].forEach.call(doc.querySelectorAll('img'),function(im){var r=im.getAttribute('src');if(r&&!/^(https?:|data:)/.test(r)){im.setAttribute('src',norm(path,r))}im.loading='lazy'});
    [].forEach.call(doc.querySelectorAll('table'),function(tb){var w=document.createElement('div');w.className='tw';tb.parentNode.insertBefore(w,tb);w.appendChild(tb)});
    [].forEach.call(doc.querySelectorAll('a[href]'),function(a){
      var r=a.getAttribute('href');if(/^(https?:|mailto:)/.test(r)){a.target='_blank';a.rel='noopener';return}
      if(r.charAt(0)==='#'){a.setAttribute('data-anchor',r.slice(1));a.setAttribute('href','javascript:void 0');return}
      var parts=r.split('#'),p=norm(path,parts[0]);
      if(/\.md$/.test(p)){a.setAttribute('href','#'+slug(p));if(!MAP[slug(p)])MAP[slug(p)]=p;if(parts[1])a.setAttribute('data-anchor',parts[1])}
      else{a.setAttribute('href',p);a.target='_blank';a.rel='noopener';if(/\.pdf$/.test(p))a.className='pdf';if(/\.(jpg|png)$/.test(p)){}}
    });
    [].forEach.call(doc.querySelectorAll('img'),function(im){if(im.parentNode.tagName!=='A'){var a=document.createElement('a');a.href=im.getAttribute('src');a.target='_blank';a.rel='noopener';a.style.display='block';a.style.border='0';im.parentNode.insertBefore(a,im);a.appendChild(im)}});
    var f=doc.querySelector('h1');if(f)document.title='I-RULE01 Developer Hub';
    if(pending){var el=document.getElementById(pending);pending=null;if(el){el.scrollIntoView();return}}
    view.scrollTop=0;window.scrollTo(0,0);
  }).catch(function(e){console.error(e);doc.innerHTML='<h1>Could not load this page</h1><p>This page is not published. <a href="#readme">Back to the overview</a>.</p>'});
}
doc.addEventListener('click',function(e){var a=e.target.closest('a[data-anchor]');if(!a)return;var id=a.getAttribute('data-anchor'),href=a.getAttribute('href');
  if(href==='javascript:void 0'){e.preventDefault();var el=document.getElementById(id);if(el)el.scrollIntoView()}else{pending=id}});
doc.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){var el=document.getElementById(g.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  var c=e.target.closest('[data-pid]');if(c){var p=LIB.P[c.getAttribute('data-pid')],k=c.getAttribute('data-pk');copyText(k==='sheet'?p.sheet:p.views[k],c)}
});
document.getElementById('menu').addEventListener('click',function(){var o=document.body.classList.toggle('open');this.setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);
route();
</script>
